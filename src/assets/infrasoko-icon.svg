<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4FD8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="darkCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1B4FD8"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="100" height="100" rx="22" fill="#0F172A"/>

  <!-- Ground -->
  <rect x="10" y="82" width="80" height="4" rx="2" fill="#1B4FD8" opacity="0.4"/>

  <!-- Left column -->
  <rect x="14" y="42" width="11" height="40" rx="2" fill="url(#darkCol)"/>

  <!-- Center tall column -->
  <rect x="44" y="22" width="18" height="60" rx="2" fill="url(#bg)"/>

  <!-- Center top accent -->
  <rect x="44" y="22" width="18" height="5" rx="2" fill="url(#acc)"/>

  <!-- Right column -->
  <rect x="75" y="52" width="11" height="30" rx="2" fill="url(#bg)" opacity="0.8"/>

  <!-- Windows — left -->
  <rect x="17" y="50" width="5" height="4" rx="1" fill="white" opacity="0.5"/>
  <rect x="17" y="59" width="5" height="4" rx="1" fill="white" opacity="0.5"/>
  <rect x="17" y="68" width="5" height="4" rx="1" fill="white" opacity="0.3"/>

  <!-- Windows — center -->
  <rect x="47" y="31" width="5" height="4" rx="1" fill="white" opacity="0.6"/>
  <rect x="54" y="31" width="5" height="4" rx="1" fill="white" opacity="0.4"/>
  <rect x="47" y="40" width="5" height="4" rx="1" fill="white" opacity="0.6"/>
  <rect x="54" y="40" width="5" height="4" rx="1" fill="white" opacity="0.6"/>
  <rect x="47" y="49" width="5" height="4" rx="1" fill="white" opacity="0.5"/>
  <rect x="54" y="49" width="5" height="4" rx="1" fill="white" opacity="0.5"/>
  <rect x="47" y="58" width="5" height="4" rx="1" fill="white" opacity="0.4"/>
  <rect x="54" y="58" width="5" height="4" rx="1" fill="white" opacity="0.6"/>

  <!-- Windows — right -->
  <rect x="78" y="58" width="5" height="4" rx="1" fill="white" opacity="0.5"/>
  <rect x="78" y="67" width="5" height="4" rx="1" fill="white" opacity="0.4"/>

  <!-- Bridge left→center -->
  <rect x="25" y="54" width="19" height="3" rx="1.5" fill="url(#acc)"/>

  <!-- Bridge center→right -->
  <rect x="62" y="63" width="13" height="3" rx="1.5" fill="url(#acc)"/>

  <!-- Crane arm -->
  <rect x="61" y="14" width="24" height="3" rx="1.5" fill="url(#acc)"/>
  <rect x="82" y="14" width="3" height="11" rx="1.5" fill="url(#acc)" opacity="0.7"/>
</svg>
