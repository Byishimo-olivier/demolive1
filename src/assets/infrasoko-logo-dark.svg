<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Ground platform -->
  <rect x="10" y="88" width="88" height="5" rx="2.5" fill="url(#brandGrad)" opacity="0.3"/>

  <!-- Left tower -->
  <rect x="18" y="42" width="12" height="46" rx="2" fill="url(#darkGrad)"/>
  <!-- Right tower -->
  <rect x="78" y="54" width="12" height="34" rx="2" fill="url(#brandGrad)"/>
  <!-- Center tall tower -->
  <rect x="43" y="22" width="22" height="66" rx="2" fill="url(#brandGrad)"/>
  <!-- Center tower top accent -->
  <rect x="43" y="22" width="22" height="6" rx="2" fill="url(#accentGrad)"/>

  <!-- Left tower windows -->
  <rect x="21" y="50" width="6" height="5" rx="1" fill="white" opacity="0.45"/>
  <rect x="21" y="60" width="6" height="5" rx="1" fill="white" opacity="0.45"/>
  <rect x="21" y="70" width="6" height="5" rx="1" fill="white" opacity="0.25"/>

  <!-- Center tower windows -->
  <rect x="47" y="32" width="6" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="55" y="32" width="6" height="5" rx="1" fill="white" opacity="0.3"/>
  <rect x="47" y="42" width="6" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="55" y="42" width="6" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="47" y="52" width="6" height="5" rx="1" fill="white" opacity="0.3"/>
  <rect x="55" y="52" width="6" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="47" y="62" width="6" height="5" rx="1" fill="white" opacity="0.5"/>
  <rect x="55" y="62" width="6" height="5" rx="1" fill="white" opacity="0.25"/>

  <!-- Right tower windows -->
  <rect x="81" y="61" width="6" height="5" rx="1" fill="white" opacity="0.45"/>
  <rect x="81" y="71" width="6" height="5" rx="1" fill="white" opacity="0.3"/>

  <!-- Connecting beams -->
  <rect x="30" y="56" width="13" height="3.5" rx="1.75" fill="url(#accentGrad)"/>
  <rect x="65" y="66" width="13" height="3.5" rx="1.75" fill="url(#accentGrad)"/>

  <!-- Crane -->
  <rect x="54" y="14" width="26" height="3" rx="1.5" fill="url(#accentGrad)"/>
  <rect x="77" y="14" width="3" height="13" rx="1.5" fill="url(#accentGrad)" opacity="0.7"/>
  <line x1="79" y1="14" x2="79" y2="27" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Wordmark -->
  <text
    x="116"
    y="73"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-1.5"
    fill="white"
  >infra</text>

  <text
    x="228"
    y="73"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-1.5"
    fill="url(#brandGrad)"
  >soko</text>

  <!-- Tagline -->
  <text
    x="117"
    y="90"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="10.5"
    font-weight="400"
    letter-spacing="3.5"
    fill="#94A3B8"
  >INFRASTRUCTURE MARKETPLACE</text>
</svg>
